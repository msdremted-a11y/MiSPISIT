<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}{{.Product}}{{end}}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <a class="brand" href="/">{{.Product}}</a>
  <nav>
    <a href="/" {{if eq .Active "home"}}class="active"{{end}}>Главная</a>
    <a href="/snapshots" {{if eq .Active "list"}}class="active"{{end}}>Снимки</a>
    <a href="/snapshots/new" {{if eq .Active "new"}}class="active"{{end}}>Новый снимок</a>
    <a href="/rejected" {{if eq .Active "rejected"}}class="active"{{end}}>Отказы</a>
    <a href="{{.Grafana}}">Панель Grafana</a>
  </nav>
</header>
<main>
{{block "content" .}}{{end}}
</main>
<footer>{{.Product}} · версия {{.Version}} · веб-часть на Go (html/template) · данные в PostgreSQL</footer>
</body>
</html>
